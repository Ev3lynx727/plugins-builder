# git-cliff configuration for plugins-builder
# Docs: https://git-cliff.org/docs/configuration/

[changelog]
# template for the generated changelog
header = """
# Changelog\n
All notable changes to this project will be documented in this file.\n
"""
# template for each release section
body = """
{% if version %}\n## [{{ version | trim_start_matches(pat="v") }}] — {{ timestamp | date(format="%Y-%m-%d") }}\n{% else %}\n## [Unreleased]\n{% endif %}\n{% for group, commits in commits | group_by(attribute="group") %}\n### {{ group | striptags | trim | upper_first }}\n{% for commit in commits %}\n- {% if commit.scope %}**({{ commit.scope }})** {% endif %}{{ commit.message | upper_first | trim }}\n{% endfor %}\n{% endfor %}\n"""
# template for the changelog footer
trim = true

[git]
# parse the commits based on https://www.conventionalcommits.org
conventional_commits = true
# filter out the commits that are not conventional
filter_unconventional = true
# process each line of a commit as an individual commit
split_commits = false
# git remote upstream URLs used to generate commit links
# remote = "origin"

# regex for parsing conventional commits
commit_parsers = [
  { message = "^feat", group = "Features" },
  { message = "^fix", group = "Bug Fixes" },
  { message = "^doc", group = "Documentation" },
  { message = "^perf", group = "Performance" },
  { message = "^refactor", group = "Refactoring" },
  { message = "^style", group = "Styling" },
  { message = "^test", group = "Testing" },
  { message = "^chore\\(release\\): prepare for", skip = true },
  { message = "^chore", group = "Miscellaneous Tasks" },
  { body = "^.*", group = "Miscellaneous Tasks" },
]

# protects breaking changes from being skipped due to matching a skipping commit_parser
protect_breaking_commits = false
# filter out the commits that are not matched by any commit parser
filter_commits = false
# regex for matching git tags
tag_pattern = "v[0-9].*"
# regex for skipping tags
# skip_tags = "v0.1.0-beta.1"
# regex for ignoring tags
# ignore_tags = ""
# sort the tags topologically
topo_order = false
# sort the commits inside sections by oldest/newest order
sort_commits = "oldest"
# limit the number of commits included in the changelog.
# limit_commits = 42
